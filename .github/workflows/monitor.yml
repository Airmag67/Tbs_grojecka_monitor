name: TBS Grójecka 91 Monitor

on:

  schedule:

    # co 10 minut
    - cron: "*/10 * * * *"

  # pozwala uruchomić ręcznie
  workflow_dispatch:


permissions:
  contents: write


jobs:

  monitor:

    runs-on: ubuntu-latest

    steps:

      - name: Pobranie repozytorium
        uses: actions/checkout@v4

      - name: Instalacja Pythona
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalacja bibliotek
        run: |
          pip install -r requirements.txt

      - name: Uruchomienie monitora
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

        run: |
          python monitor.py

      - name: Zapisanie stanu
        run: |

          git config user.name "TBS Monitor"

          git config user.email "tbs-monitor@users.noreply.github.com"

          git add state.json

          git diff --cached --quiet || git commit -m "Update monitor state"

          git push
