name: TBS Grójecka 91 Monitor

on:
  schedule:
    - cron: "*/10 * * * *"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  monitor:

    runs-on: ubuntu-latest

    steps:

      - name: Pobierz repozytorium
        uses: actions/checkout@v4

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalacja bibliotek
        run: |
          pip install -r requirements.txt

      - name: Uruchom monitor
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python monitor.py

      - name: Zapisz stan monitora
        run: |

          git config user.name "TBS Grójecka 91 Monitor"

          git config user.email "tbs-grojecka-monitor@users.noreply.github.com"

          git add state.json

          git diff --cached --quiet || git commit -m "Update monitor state"

          git push
